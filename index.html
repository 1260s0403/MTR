<!DOCTYPE html>

<head>
    <meta charset="UTF-8" />

    <title>Загрузка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0B0F1A;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .logo-wrap {
            width: 100%;
            opacity: 0;
            transform: scale(0.92);
            animation: fadeLogo 1.2s ease 0.1s forwards;
        }

        .logo-wrap svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* ===== РАССТОЯНИЕ 25px ===== */
        .gap {
            height: 25px;
        }

        .name-wrap {
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeName 1s ease 1s forwards;
        }

        .name-wrap svg {
            display: block;
            width: 100%;
            height: auto;
        }

        @keyframes fadeLogo {
            0% {
                opacity: 0;
                transform: scale(0.92);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeName {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
