<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetricHit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0B0F19;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      font-family: 'Inter', sans-serif;
    }

    /* ===== ИНТРО ===== */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #00F0FF;
      transition: opacity 0.8s ease;
    }

    #intro.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ===== ЛОГОТИП ===== */
    #logoContainer {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #logoContainer svg {
      display: block;
      width: 600px;
      height: auto;
    }

    /* Группы букв */
    .letter-group {
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Буквы "MH" — появляются первыми */
    .letter-group.mh {
      opacity: 1;
      transform: scale(1);
    }

    /* "etric" — выезжает слева */
    .letter-group.etric {
      transform: translateX(-80px);
    }

    .letter-group.etric.show {
      opacity: 1;
      transform: translateX(0);
    }

    /* "it" — выезжает справа */
    .letter-group.it {
      transform: translateX(80px);
    }

    .letter-group.it.show {
      opacity: 1;
      transform: translateX(0);
    }

    /* ===== ЛОГОТИП УЛЕТАЕТ ===== */
    #logoContainer.fly-up {
      transform: translateY(-200px) scale(0.5);
      opacity: 0;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 1s ease;
    }

    /* ===== ЛОГОТИП В УГЛУ ===== */
    #logoHint {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 1001;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      opacity: 0;
      transition: opacity 0.6s ease 0.3s;
    }

    #logoHint.show {
      opacity: 1;
    }

    #logoHint span:first-child {
      color: #FFFFFF;
    }
    #logoHint span:last-child {
      color: #00F0FF;
    }

    /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
    #main {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 40px;
      opacity: 0;
      transition: opacity 0.8s ease 0.3s;
      pointer-events: none;
    }

    #main.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #main h1 {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 800;
      text-align: center;
      line-height: 1.1;
      max-width: 700px;
      color: #FFFFFF;
    }

    #main h1 .highlight {
      color: #00F0FF;
    }

    #main p {
      color: #94A3B8;
      font-size: clamp(16px, 1.5vw, 22px);
      margin-top: 16px;
      text-align: center;
      max-width: 500px;
    }

    #main .btn {
      margin-top: 32px;
      padding: 16px 48px;
      border-radius: 12px;
      background: #00F0FF;
      color: #0B0F19;
      font-weight: 700;
      font-size: 18px;
      border: none;
      cursor: pointer;
      transition: box-shadow 0.3s, transform 0.2s;
    }

    #main .btn:hover {
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.4);
      transform: translateY(-2px);
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 768px) {
      #logoContainer svg {
        width: 320px;
      }
      #logoContainer.fly-up {
        transform: translateY(-120px) scale(0.4);
      }
    }

    @media (max-width: 480px) {
      #logoContainer svg {
        width: 240px;
      }
      #logoContainer.fly-up {
        transform: translateY(-80px) scale(0.3);
      }
    }
  </style>
</head>

  </div>

  <!-- ЛОГОТИП В УГЛУ -->
  <div id="logoHint">
    <span>Metric</span><span>Hit</span>
  </div>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <div id="main">
    <h1>Увеличиваем органический<br>трафик из <span class="highlight">Яндекса</span></h1>
    <p>Реальные пользователи. Прозрачная модель. Без абонплаты.</p>
    <button class="btn">Начать тест</button>
  </div>

  <script>
    // ================================================================
    //  ПРОСТОЙ СЦЕНАРИЙ
    // ================================================================

    (function() {
      const intro = document.getElementById('intro');
      const logoContainer = document.getElementById('logoContainer');
      const logoHint = document.getElementById('logoHint');
      const main = document.getElementById('main');

      // Ждём 0.5 сек, чтобы фон прогрузился
      setTimeout(function() {
        // Показываем "etric" (выезжает слева)
        document.querySelector('.letter-group.etric').classList.add('show');
      }, 500);

      setTimeout(function() {
        // Показываем "it" (выезжает справа)
        document.querySelector('.letter-group.it').classList.add('show');
      }, 900);

      setTimeout(function() {
        // Логотип улетает вверх
        logoContainer.classList.add('fly-up');
      }, 2200);

      setTimeout(function() {
        // Появляется контент
        intro.classList.add('hidden');
        logoHint.classList.add('show');
        main.classList.add('visible');

        setTimeout(function() {
          intro.style.display = 'none';
        }, 1000);
      }, 3200);

      console.log('🚀 MetricHit запущен!');
    })();

    // Фолбэк
    setTimeout(function() {
      const intro = document.getElementById('intro');
      if (!intro.classList.contains('hidden')) {
        intro.classList.add('hidden');
        document.getElementById('logoHint').classList.add('show');
        document.getElementById('main').classList.add('visible');
        setTimeout(function() {
          intro.style.display = 'none';
        }, 500);
      }
    }, 5000);
  </script>
</body>
</html>
