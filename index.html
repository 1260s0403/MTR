<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetricHit Intro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050508;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер интро */
        .intro-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0c0f1d 0%, #030305 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        /* Flex-сетка для сборки логотипа из 3 частей */
        .logo-flex-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90vw;
            max-width: 750px;
            opacity: 0;
            transform: scale(0.95);
            animation: fadeIn 1s ease forwards;
        }

        /* Общие настройки для трех блоков SVG */
        .logo-block { height: auto; display: block; overflow: hidden; transition: all 1.2s cubic-bezier(0.77, 0, 0.175, 1); }
        .neon { filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.75)); }

        /* --- СОСТОЯНИЕ 1: НАЧАЛО (Видны только M и H) --- */
        .block-left {
            width: calc(100% * (140 / 920)); /* Ширина только для буквы M */
            flex-shrink: 0;
        }
        .block-center {
            width: calc(100% * (115 / 920)); /* Ширина буквы H */
            flex-shrink: 0;
        }
        .block-right {
            width: 0%; /* Буквы it полностью скрыты */
            opacity: 0;
        }
        
        /* Первая буква N (скрыта в начале) */
        #letter-n {
            width: 0%;
            opacity: 0;
            transition: all 1s cubic-bezier(0.77, 0, 0.175, 1);
        }

        /* --- СОСТОЯНИЕ 2: АНИМАЦИЯ (Разъезжание в MetricHit) --- */
        .animated .block-left {
            width: calc(100% * (470 / 920)); /* Расширяется, показывая etric */
        }
        .animated .block-right {
            width: calc(100% * (180 / 920)); /* Расширяется, показывая it */
            opacity: 1;
        }
        .animated #letter-n {
            width: calc(100% * (110 / 920)); /* Появляется буква N */
            opacity: 1;
        }

        /* Кнопка входа */
        .enter-btn {
            margin-top: 60px; background: transparent; border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff; padding: 12px 35px; font-size: 13px; letter-spacing: 4px;
            text-transform: uppercase; cursor: pointer; border-radius: 4px;
            opacity: 0; transform: translateY(10px);
            transition: all 0.4s ease;
        }
        .animated .enter-btn { animation: fadeInBtn 0.8s ease forwards 1.2s; }
        .enter-btn:hover { border-color: #00F0FF; color: #00F0FF; box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
        .intro-container.fade-out { opacity: 0; visibility: hidden; transform: scale(1.05); }

        @keyframes fadeIn { to { opacity: 1; transform: scale(1); } }
        @keyframes fadeInBtn { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
