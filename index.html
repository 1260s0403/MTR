<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetricHit — Интро</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0B0F19;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      font-family: 'Inter', sans-serif;
    }

    /* ===== ИНТРО-ЭКРАН ===== */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0F19;
      transition: opacity 0.8s ease;
    }

    #intro.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ===== ВЗРЫВ (круг) ===== */
    #explosion {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, #00F0FF 0%, rgba(0, 240, 255, 0.6) 30%, rgba(0, 240, 255, 0.1) 60%, transparent 80%);
      opacity: 0;
      transform: scale(0);
      pointer-events: none;
    }

    #explosion.active {
      animation: explode 1.8s ease-out forwards;
    }

    @keyframes explode {
      0% {
        opacity: 0;
        transform: scale(0);
      }
      15% {
        opacity: 1;
        transform: scale(0.3);
      }
      50% {
        opacity: 1;
        transform: scale(1.8);
      }
      100% {
        opacity: 0;
        transform: scale(3.5);
      }
    }

    /* ===== КОНТЕЙНЕР ДЛЯ ПЫЛИНОК ===== */
    #sparklesContainer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }

    /* ===== ПЫЛИНКИ ===== */
    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #00F0FF;
      opacity: 0;
      pointer-events: none;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      transition: none;
    }

    .sparkle.fly {
      animation: sparkleFly 2.2s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
    }

    @keyframes sparkleFly {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0);
      }
    }

    /* ===== БУКВА "H" ===== */
    #letterH {
      position: absolute;
      font-size: 200px;
      font-weight: 900;
      color: #00F0FF;
      text-shadow: 0 0 60px rgba(0, 240, 255, 0.4), 0 0 120px rgba(0, 240, 255, 0.15);
      opacity: 0;
      transform: scale(0.3);
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      letter-spacing: -10px;
      font-family: 'Inter', sans-serif;
    }

    #letterH.show {
      opacity: 1;
      transform: scale(1);
    }

    /* ===== ЛОГОТИП В УГЛУ ===== */
    #logoHint {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 1001;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      opacity: 0;
      transition: opacity 0.6s ease 0.3s;
    }

    #logoHint.show {
      opacity: 1;
    }

    #logoHint span:first-child {
      color: #FFFFFF;
    }
    #logoHint span:last-child {
      color: #00F0FF;
    }

    /* ===== ЗАГРУЗКА ===== */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0F19;
      color: #00F0FF;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      transition: opacity 0.5s;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 600px) {
      #letterH {
        font-size: 120px;
      }
      .sparkle {
        width: 3px;
        height: 3px;
      }
    }
  </style>
</head>
<body>

  <!-- ЗАГРУЗКА -->
  <div id="loading">Загрузка...</div>

  <!-- ИНТРО -->
  <div id="intro">
    <!-- Взрыв -->
    <div id="explosion"></div>

    <!-- Контейнер для пылинок -->
    <div id="sparklesContainer"></div>

    <!-- Буква H -->
    <div id="letterH">H</div>
  </div>

  <!-- ЛОГОТИП В УГЛУ -->
  <div id="logoHint">
    <span>Metric</span><span>Hit</span>
  </div>

  <script>
    // ================================================================
    //  НАСТРОЙКИ
    // ================================================================
    const CONFIG = {
      sparkleCount: 200,
      explosionDuration: 1800, // мс
      collectDelay: 400, // задержка перед сборкой
      flyDuration: 2200, // длительность полёта пылинок
    };

    // ================================================================
    //  СОЗДАНИЕ ПЫЛИНОК
    // ================================================================
    function createSparkles() {
      const container = document.getElementById('sparklesContainer');
      const count = CONFIG.sparkleCount;

      // Очищаем
      container.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';

        // Случайное направление и расстояние
        const angle = Math.random() * Math.PI * 2;
        const distance = 100 + Math.random() * Math.min(window.innerWidth, window.innerHeight) * 0.45;

        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;

        sparkle.style.setProperty('--tx', tx + 'px');
        sparkle.style.setProperty('--ty', ty + 'px');

        // Случайный размер
        const size = 2 + Math.random() * 4;
        sparkle.style.width = size + 'px';
        sparkle.style.height = size + 'px';

        // Случайный цвет (от белого к бирюзовому)
        const mix = Math.random();
        if (mix > 0.7) {
          sparkle.style.background = '#FFFFFF';
        } else {
          sparkle.style.background = '#00F0FF';
        }

        // Случайная задержка для эффекта "волны"
        const delay = Math.random() * 0.3;
        sparkle.style.animationDelay = delay + 's';

        container.appendChild(sparkle);
      }
    }

    // ================================================================
    //  ЗАПУСК АНИМАЦИИ
    // ================================================================
    function startAnimation() {
      const explosion = document.getElementById('explosion');
      const sparkles = document.querySelectorAll('.sparkle');
      const letterH = document.getElementById('letterH');
      const intro = document.getElementById('intro');
      const logoHint = document.getElementById('logoHint');
      const loading = document.getElementById('loading');

      // ---- ШАГ 1: ВЗРЫВ (0ms) ----
      explosion.classList.add('active');

      // ---- ШАГ 2: ПЫЛИНКИ (200ms) ----
      setTimeout(() => {
        sparkles.forEach((el, i) => {
          // Добавляем небольшую задержку для каждой
          setTimeout(() => {
            el.classList.add('fly');
          }, i * 8);
        });
      }, 200);

      // ---- ШАГ 3: ПОЯВЛЕНИЕ БУКВЫ "H" (после взрыва + задержка) ----
      const totalDelay = CONFIG.explosionDuration + CONFIG.collectDelay;
      setTimeout(() => {
        letterH.classList.add('show');
      }, totalDelay);

      // ---- ШАГ 4: ЗАВЕРШЕНИЕ ИНТРО (после появления H) ----
      setTimeout(() => {
        intro.classList.add('hidden');
        logoHint.classList.add('show');
        loading.classList.add('hidden');

        // Убираем интро из DOM через 1 секунду
        setTimeout(() => {
          intro.style.display = 'none';
        }, 1000);
      }, totalDelay + 800);
    }

    // ================================================================
    //  ИНИЦИАЛИЗАЦИЯ
    // ================================================================
    function init() {
      createSparkles();

      // Небольшая задержка перед стартом
      setTimeout(startAnimation, 400);

      console.log('🚀 MetricHit Intro запущен!');
      console.log(`✨ Пылинок: ${CONFIG.sparkleCount}`);
      console.log(`💥 Взрыв: ${CONFIG.explosionDuration}ms`);
    }

    // Запускаем
    document.addEventListener('DOMContentLoaded', init);

    // Фолбэк на случай зависания
    setTimeout(() => {
      const intro = document.getElementById('intro');
      if (!intro.classList.contains('hidden')) {
        console.warn('⚠️ Фолбэк: принудительное завершение');
        intro.classList.add('hidden');
        document.getElementById('logoHint').classList.add('show');
        document.getElementById('loading').classList.add('hidden');
        setTimeout(() => { intro.style.display = 'none'; }, 500);
      }
    }, 6000);
  </script>
</body>
</html>
