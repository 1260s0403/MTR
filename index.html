<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>MetricHit intro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .intro {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 10;
    }

    .intro svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Буква M + слово etric */
    .letter-m {
      animation: moveM 1.2s cubic-bezier(0.33, 0.66, 0.45, 1) forwards;
      animation-delay: 0.6s;
    }

    /* Текст etric внутри буквы M */
    .text-etric {
      opacity: 0;
      animation: showText 0.8s ease forwards;
      animation-delay: 0.9s;
    }

    /* Буква H остается на месте, получает маленький сдвиг для баланса */
    .letter-h {
      animation: stabilizeH 0.01s linear forwards;
      animation-delay: 1.7s;
    }

    /* Текст it выезжает вправо */
    .text-it {
      opacity: 0;
      transform: translateX(-80px);
      animation: showIt 1s ease forwards;
      animation-delay: 1.2s;
    }

    @keyframes moveM {
      to {
        transform: translateX(-350px);
      }
    }

    @keyframes showText {
      to {
        opacity: 1;
      }
    }

    @keyframes showIt {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Фиктивный keyframe для задержки, чтобы H не дёргалась */
    @keyframes stabilizeH {
      to {
        transform: translateX(0);
      }
    }
  </style>
</head>
