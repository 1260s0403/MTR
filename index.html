<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetricHit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0B0F19;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    /* ===== ИНТРО-ЭКРАН ===== */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0F19;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #intro.hidden {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }

    /* ===== ВЗРЫВ ===== */
    #explosion {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, #00F0FF 0%, rgba(0, 240, 255, 0.4) 40%, transparent 70%);
      opacity: 0;
      transform: scale(0);
      transition: none;
    }

    #explosion.active {
      animation: explode 1.2s ease-out forwards;
    }

    @keyframes explode {
      0% {
        opacity: 0;
        transform: scale(0);
      }
      20% {
        opacity: 1;
        transform: scale(0.5);
      }
      60% {
        opacity: 1;
        transform: scale(2);
      }
      100% {
        opacity: 0;
        transform: scale(3);
      }
    }

    /* ===== ПЫЛИНКИ ===== */
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00F0FF;
      opacity: 0;
      pointer-events: none;
    }

    .sparkle.fly {
      animation: sparkleFly 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes sparkleFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0);
      }
    }

    /* ===== ЛОГОТИП ===== */
    #logoContainer {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #logoContainer.visible {
      opacity: 1;
      transform: scale(1);
    }

    #logoContainer .letter {
      font-size: 80px;
      font-weight: 900;
      letter-spacing: -4px;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      display: inline-block;
    }

    #logoContainer .letter.show {
      opacity: 1;
      transform: translateY(0);
    }

    #logoContainer .letter.metric {
      color: #FFFFFF;
    }

    #logoContainer .letter.hit {
      color: #00F0FF;
      text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    }

    /* Специальный стиль для буквы H (она появляется первой) */
    #logoContainer .letter.h-first {
      color: #00F0FF;
      text-shadow: 0 0 40px rgba(0, 240, 255, 0.5);
      font-size: 90px;
    }

    /* ===== ЛОГОТИП УЛЕТАЕТ ВВЕРХ ===== */
    #logoContainer.fly-up {
      transform: translateY(-120px) scale(0.7);
      opacity: 0.6;
      transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1), opacity 1s ease;
    }

    /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
    #main {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 40px;
      opacity: 0;
      transition: opacity 0.8s ease 0.3s;
      pointer-events: none;
    }

    #main.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #main h1 {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 800;
      text-align: center;
      line-height: 1.1;
      max-width: 700px;
      color: #FFFFFF;
    }

    #main h1 .highlight {
      color: #00F0FF;
    }

    #main p {
      color: #94A3B8;
      font-size: clamp(16px, 1.5vw, 22px);
      margin-top: 16px;
      text-align: center;
      max-width: 500px;
    }

    #main .btn {
      margin-top: 32px;
      padding: 16px 48px;
      border-radius: 12px;
      background: #00F0FF;
      color: #0B0F19;
      font-weight: 700;
      font-size: 18px;
      border: none;
      cursor: pointer;
      transition: box-shadow 0.3s, transform 0.2s;
    }

    #main .btn:hover {
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.4);
      transform: translateY(-2px);
    }

    /* Логотип в шапке основного контента */
    .header-logo {
      position: fixed;
      top: 24px;
      left: 32px;
      z-index: 101;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      opacity: 0;
      transition: opacity 0.6s ease 0.8s;
    }

    .header-logo.visible {
      opacity: 1;
    }

    .header-logo span:first-child { color: #FFFFFF; }
    .header-logo span:last-child { color: #00F0FF; }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 600px) {
      #logoContainer .letter {
        font-size: 40px;
        letter-spacing: -2px;
      }
      #logoContainer .letter.h-first {
        font-size: 48px;
      }
      #logoContainer.fly-up {
        transform: translateY(-60px) scale(0.6);
      }
    }
  </style>
</head>
<body>

  <!-- ===== ИНТРО ===== -->
  <div id="intro">
    <!-- Взрыв -->
    <div id="explosion"></div>
    <!-- Логотип (собирается из букв) -->
    <div id="logoContainer">
      <!-- Буквы будут добавлены через JS -->
    </div>
  </div>

  <!-- ===== ЛОГОТИП В ШАПКЕ ===== -->
  <div class="header-logo" id="headerLogo">
    <span>Metric</span><span>Hit</span>
  </div>

  <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
  <div id="main">
    <h1>Увеличиваем органический<br>трафик из <span class="highlight">Яндекса</span></h1>
    <p>Реальные пользователи. Прозрачная модель. Без абонплаты.</p>
    <button class="btn">Начать тест</button>
  </div>

  <script>
    // ================================================================
    //  КОНФИГ
    // ================================================================
    const CONFIG = {
      // Время между появлением букв (мс)
      letterDelay: 80,
      // Время до начала сборки после взрыва (мс)
      collectDelay: 1800,
      // Время до отъезда логотипа (мс)
      flyDelay: 4200,
      // Время до появления контента (мс)
      contentDelay: 5200,
    };

    // ================================================================
    //  СОЗДАНИЕ ЛОГОТИПА ИЗ БУКВ
    // ================================================================
    function createLogo() {
      const container = document.getElementById('logoContainer');
      const text = 'MetricHit';
      const html = [];

      // Разбиваем на буквы
      const letters = text.split('');

      for (let i = 0; i < letters.length; i++) {
        const char = letters[i];
        const isMetric = i < 6; // M e t r i c
        const isH = i === 6; // H (первая буква Hit)
        const className = isH ? 'letter h-first' : (isMetric ? 'letter metric' : 'letter hit');
        html.push(`<span class="${className}" data-index="${i}">${char}</span>`);
      }

      container.innerHTML = html.join('');
    }

    // ================================================================
    //  СОЗДАНИЕ ПЫЛИНОК
    // ================================================================
    function createSparkles() {
      const container = document.getElementById('intro');
      const count = 40;
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      for (let i = 0; i < count; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        const angle = Math.random() * Math.PI * 2;
        const distance = 150 + Math.random() * 350;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        sparkle.style.setProperty('--tx', tx + 'px');
        sparkle.style.setProperty('--ty', ty + 'px');
        sparkle.style.left = centerX + 'px';
        sparkle.style.top = centerY + 'px';
        sparkle.style.width = (4 + Math.random() * 6) + 'px';
        sparkle.style.height = sparkle.style.width;
        sparkle.style.background = Math.random() > 0.5 ? '#00F0FF' : '#FFFFFF';
        container.appendChild(sparkle);
      }
    }

    // ================================================================
    //  ЗАПУСК АНИМАЦИИ
    // ================================================================
    function startAnimation() {
      const explosion = document.getElementById('explosion');
      const logoContainer = document.getElementById('logoContainer');
      const letters = logoContainer.querySelectorAll('.letter');
      const intro = document.getElementById('intro');
      const main = document.getElementById('main');
      const headerLogo = document.getElementById('headerLogo');

      // ---- ШАГ 1: ВЗРЫВ (0ms) ----
      explosion.classList.add('active');

      // ---- ШАГ 2: ПЫЛИНКИ (200ms) ----
      setTimeout(() => {
        document.querySelectorAll('.sparkle').forEach(el => {
          el.classList.add('fly');
        });
      }, 200);

      // ---- ШАГ 3: ПОКАЗ ЛОГОТИПА (1800ms) ----
      setTimeout(() => {
        logoContainer.classList.add('visible');

        // Показываем буквы с задержкой
        letters.forEach((letter, index) => {
          setTimeout(() => {
            letter.classList.add('show');
          }, index * CONFIG.letterDelay);
        });
      }, CONFIG.collectDelay);

      // ---- ШАГ 4: ЛОГОТИП УЛЕТАЕТ (4200ms) ----
      setTimeout(() => {
        logoContainer.classList.add('fly-up');
      }, CONFIG.flyDelay);

      // ---- ШАГ 5: ПОЯВЛЕНИЕ КОНТЕНТА (5200ms) ----
      setTimeout(() => {
        intro.classList.add('hidden');
        main.classList.add('visible');
        headerLogo.classList.add('visible');

        // Убираем интро из потока через 1 секунду
        setTimeout(() => {
          intro.style.display = 'none';
        }, 1000);
      }, CONFIG.contentDelay);
    }

    // ================================================================
    //  ИНИЦИАЛИЗАЦИЯ
    // ================================================================
    function init() {
      createLogo();
      createSparkles();

      // Небольшая задержка перед стартом
      setTimeout(startAnimation, 300);

      console.log('🚀 MetricHit Intro запущен!');
    }

    // Запускаем
    document.addEventListener('DOMContentLoaded', init);

    // Перезапуск при ресайзе (обновляем позиции пылинок)
    window.addEventListener('resize', () => {
      // Просто пересоздаём пылинки, если они ещё не улетели
      const sparkles = document.querySelectorAll('.sparkle:not(.fly)');
      if (sparkles.length > 0) {
        sparkles.forEach(el => el.remove());
        createSparkles();
      }
    });

    // Фолбэк: если что-то пошло не так
    setTimeout(() => {
      const intro = document.getElementById('intro');
      if (!intro.classList.contains('hidden')) {
        console.warn('⚠️ Фолбэк: принудительный показ контента');
        intro.classList.add('hidden');
        document.getElementById('main').classList.add('visible');
        document.getElementById('headerLogo').classList.add('visible');
        setTimeout(() => { intro.style.display = 'none'; }, 1000);
      }
    }, 8000);
  </script>
</body>
</html>
