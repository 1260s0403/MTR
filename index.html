<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetricHit — Интро</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0B0F19;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #introCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 100;
    }

    /* Логотип в углу (появится после интро) */
    #logoHint {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 101;
      font-family: 'Inter', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      opacity: 0;
      transition: opacity 0.8s ease 0.3s;
    }
    #logoHint.show {
      opacity: 1;
    }
    #logoHint span:first-child { color: #FFFFFF; }
    #logoHint span:last-child { color: #00F0FF; }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0F19;
      color: #00F0FF;
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      transition: opacity 0.5s;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="loading">Загрузка...</div>

  <canvas id="introCanvas"></canvas>

  <div id="logoHint">
    <span>Metric</span><span>Hit</span>
  </div>

  <script>
    // ================================================================
    //  1. НАСТРОЙКИ
    // ================================================================
    const CONFIG = {
      particleCount: 500,
      particleSize: 2.5,
      // Взрыв
      explosionDuration: 2200, // мс (дольше)
      // Сборка
      collectDuration: 1200,   // мс
      // Задержка перед сборкой после взрыва
      delayBeforeCollect: 400, // мс
    };

    // ================================================================
    //  2. CANVAS
    // ================================================================
    const canvas = document.getElementById('introCanvas');
    const ctx = canvas.getContext('2d');
    let W, H, cx, cy;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      cx = W / 2;
      cy = H / 2;
    }
    resize();
    window.addEventListener('resize', resize);

    // ================================================================
    //  3. КЛАСС ЧАСТИЦЫ
    // ================================================================
    class Particle {
      constructor(index) {
        // Стартовая позиция — центр
        this.x = cx;
        this.y = cy;
        this.startX = cx;
        this.startY = cy;

        // Случайное направление и расстояние для взрыва
        const angle = Math.random() * Math.PI * 2;
        const distance = 80 + Math.random() * Math.min(W, H) * 0.5;
        this.targetX = cx + Math.cos(angle) * distance;
        this.targetY = cy + Math.sin(angle) * distance;

        // Скорость разлёта (индивидуальная)
        this.speed = 0.6 + Math.random() * 0.8;

        // Размер
        this.size = CONFIG.particleSize * (0.5 + Math.random() * 1);

        // Цвет: от белого к бирюзовому
        const mix = 0.3 + Math.random() * 0.7;
        this.r = Math.round(255 - mix * 200);
        this.g = Math.round(255 - mix * 100);
        this.b = Math.round(255 - mix * 100);

        // Прогресс взрыва (0 → 1)
        this.explodeProgress = 0;

        // Точка для сборки (будет назначена позже)
        this.collectTarget = null;
        this.collectProgress = 0;

        // Фаза: 'explode' → 'collect' → 'done'
        this.phase = 'explode';

        // Индекс для случайности
        this.index = index;
      }

      // Обновление
      update() {
        if (this.phase === 'explode') {
          // Прогресс взрыва
          this.explodeProgress += this.speed * 0.012;

          if (this.explodeProgress >= 1) {
            this.explodeProgress = 1;
            this.x = this.targetX;
            this.y = this.targetY;
          } else {
            // easeOutCubic
            const t = this.explodeProgress;
            const ease = 1 - Math.pow(1 - t, 3);
            this.x = this.startX + (this.targetX - this.startX) * ease;
            this.y = this.startY + (this.targetY - this.startY) * ease;
          }
        } else if (this.phase === 'collect' && this.collectTarget) {
          this.collectProgress += 0.035;

          if (this.collectProgress >= 1) {
            this.collectProgress = 1;
            this.x = this.collectTarget.x;
            this.y = this.collectTarget.y;
            this.phase = 'done';
          } else {
            const t = this.collectProgress;
            const ease = 1 - Math.pow(1 - t, 3);
            this.x = this.x + (this.collectTarget.x - this.x) * ease;
            this.y = this.y + (this.collectTarget.y - this.y) * ease;
          }
        }
      }

      // Рендер
      draw(ctx) {
        if (this.phase === 'done') {
          // Частицы в собранном состоянии — чуть ярче
          ctx.fillStyle = '#00F0FF';
          ctx.shadowColor = '#00F0FF';
          ctx.shadowBlur = 6;
        } else {
          const alpha = 0.6 + 0.4 * (1 - this.explodeProgress);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = `rgb(${this.r}, ${this.g}, ${this.b})`;
          ctx.shadowBlur = 0;
        }

        const size = this.phase === 'done' ? this.size * 1.2 : this.size;
        ctx.beginPath();
        ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      }
    }

    // ================================================================
    //  4. ТОЧКИ ДЛЯ БУКВЫ "H"
    // ================================================================
    function generateLetterHPoints(count) {
      const points = [];
      const scale = Math.min(W, H) * 0.22;
      const cx2 = cx;
      const cy2 = cy;

      // H состоит из 3 линий: левая, правая, перекладина
      // Левая вертикаль
      for (let i = 0; i < count * 0.32; i++) {
        const t = i / (count * 0.32);
        const y = cy2 - scale + t * scale * 2;
        const x = cx2 - scale * 0.35 + (Math.random() - 0.5) * scale * 0.08;
        points.push({ x, y });
      }

      // Правая вертикаль
      for (let i = 0; i < count * 0.32; i++) {
        const t = i / (count * 0.32);
        const y = cy2 - scale + t * scale * 2;
        const x = cx2 + scale * 0.35 + (Math.random() - 0.5) * scale * 0.08;
        points.push({ x, y });
      }

      // Перекладина (центр)
      for (let i = 0; i < count * 0.36; i++) {
        const t = i / (count * 0.36);
        const x = cx2 - scale * 0.35 + t * scale * 0.7;
        const y = cy2 + (Math.random() - 0.5) * scale * 0.08;
        points.push({ x, y });
      }

      // Перемешиваем, чтобы частицы распределялись равномерно
      for (let i = points.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [points[i], points[j]] = [points[j], points[i]];
      }

      return points;
    }

    // ================================================================
    //  5. СИСТЕМА
    // ================================================================
    let particles = [];
    let hPoints = [];
    let isCollecting = false;
    let isDone = false;
    let startTime = 0;
    let animationId = null;

    function initParticles() {
      particles = [];
      for (let i = 0; i < CONFIG.particleCount; i++) {
        particles.push(new Particle(i));
      }
    }

    function startCollect() {
      if (isCollecting) return;
      isCollecting = true;

      // Генерируем точки для буквы H
      hPoints = generateLetterHPoints(CONFIG.particleCount);

      // Назначаем каждой частице цель
      for (let i = 0; i < particles.length; i++) {
        const target = hPoints[i % hPoints.length] || hPoints[0];
        particles[i].collectTarget = { x: target.x, y: target.y };
        particles[i].phase = 'collect';
        particles[i].collectProgress = 0;
      }
    }

    // ================================================================
    //  6. ОСНОВНОЙ ЦИКЛ
    // ================================================================
    function animate(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed = timestamp - startTime;

      // Обновляем частицы
      for (const p of particles) {
        p.update();
      }

      // --- УПРАВЛЕНИЕ ФАЗАМИ ---
      // 1. Взрыв длится 2200ms
      // 2. Сборка начинается через 400ms после взрыва + небольшая задержка
      if (elapsed > CONFIG.explosionDuration + CONFIG.delayBeforeCollect && !isCollecting) {
        startCollect();
      }

      // 3. Завершение через 800ms после начала сборки
      if (isCollecting && !isDone) {
        const allDone = particles.every(p => p.phase === 'done');
        if (allDone) {
          isDone = true;
          console.log('✅ Сборка завершена!');
          // Показываем логотип в углу
          document.getElementById('logoHint').classList.add('show');
          // Скрываем загрузку
          document.getElementById('loading').classList.add('hidden');
        }
      }

      // --- РЕНДЕР ---
      ctx.clearRect(0, 0, W, H);

      // Фон (с эффектом свечения в центре во время взрыва)
      const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.6);

      if (elapsed < CONFIG.explosionDuration) {
        const intensity = Math.min(elapsed / 800, 1);
        const r = Math.round(11 + 200 * intensity);
        const g = Math.round(15 + 225 * intensity);
        const b = Math.round(25 + 230 * intensity);
        bgGrad.addColorStop(0, `rgb(${Math.min(r, 200)}, ${Math.min(g, 240)}, ${Math.min(b, 255)})`);
        bgGrad.addColorStop(0.3, `rgb(${Math.min(r, 150)}, ${Math.min(g, 200)}, ${Math.min(b, 230)})`);
        bgGrad.addColorStop(1, '#0B0F19');
      } else {
        bgGrad.addColorStop(0, '#0B0F19');
        bgGrad.addColorStop(1, '#0B0F19');
      }
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // --- РИСУЕМ ВСПЫШКУ В ЦЕНТРЕ ---
      if (elapsed < CONFIG.explosionDuration) {
        const progress = elapsed / CONFIG.explosionDuration;
        const glowSize = 200 + progress * 400;
        const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowSize);
        const alpha = Math.max(0, 1 - progress * 1.1);
        glow.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.5})`);
        glow.addColorStop(0.3, `rgba(0, 240, 255, ${alpha * 0.3})`);
        glow.addColorStop(1, 'rgba(0, 240, 255, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, H);
      }

      // --- РИСУЕМ ЧАСТИЦЫ ---
      for (const p of particles) {
        p.draw(ctx);
      }

      // --- ОТОБРАЖАЕМ ПРОГРЕСС (ДЛЯ ОТЛАДКИ) ---
      if (!isDone) {
        const done = particles.filter(p => p.phase === 'done').length;
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.font = '12px monospace';
        ctx.fillText(`Частицы: ${done}/${particles.length}  |  Фаза: ${isCollecting ? 'сборка' : 'взрыв'}  |  ${Math.round(elapsed/1000)}с`, 20, H - 30);
      }

      animationId = requestAnimationFrame(animate);
    }

    // ================================================================
    //  7. ЗАПУСК
    // ================================================================
    function start() {
      initParticles();
      console.log(`🚀 MetricHit: ${CONFIG.particleCount} частиц, взрыв ${CONFIG.explosionDuration}ms`);
      animate(0);
    }

    // Запускаем через 100ms для полной инициализации
    setTimeout(start, 100);

    // Фолбэк на случай зависания
    setTimeout(() => {
      if (!isDone) {
        console.warn('⚠️ Фолбэк: принудительное завершение');
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('logoHint').classList.add('show');
        isDone = true;
      }
    }, 6000);

    // Ресайз — пересчёт позиций
    window.addEventListener('resize', () => {
      resize();
      // Пересчитываем точки для H при ресайзе, если ещё не началась сборка
      if (!isCollecting) {
        hPoints = generateLetterHPoints(CONFIG.particleCount);
      }
    });

    console.log('✅ Интро загружен. Ожидайте анимацию...');
  </script>
</body>
</html>
