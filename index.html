<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetricHit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0B0F19;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      font-family: 'Inter', sans-serif;
    }

    /* ===== ИНТРО ===== */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0F19;
      transition: opacity 0.8s ease;
    }

    #intro.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ===== ВЗРЫВ ===== */
    #explosion {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, #00F0FF 0%, rgba(0, 240, 255, 0.6) 30%, rgba(0, 240, 255, 0.1) 60%, transparent 80%);
      opacity: 0;
      transform: scale(0);
      pointer-events: none;
    }

    #explosion.active {
      animation: explode 1.8s ease-out forwards;
    }

    @keyframes explode {
      0% {
        opacity: 0;
        transform: scale(0);
      }
      15% {
        opacity: 1;
        transform: scale(0.3);
      }
      50% {
        opacity: 1;
        transform: scale(1.8);
      }
      100% {
        opacity: 0;
        transform: scale(3.5);
      }
    }

    /* ===== КОНТЕЙНЕР ДЛЯ ПЫЛИНОК ===== */
    #sparklesContainer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }

    /* ===== ПЫЛИНКИ ===== */
    .sparkle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .sparkle.fly {
      animation: sparkleFly 2.2s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
    }

    @keyframes sparkleFly {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0);
      }
    }

    /* ===== БУКВА "H" ===== */
    #letterH {
      position: absolute;
      font-size: 200px;
      font-weight: 900;
      color: #00F0FF;
      text-shadow: 0 0 60px rgba(0, 240, 255, 0.4), 0 0 120px rgba(0, 240, 255, 0.15);
      opacity: 0;
      transform: scale(0.5);
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: 'Inter', sans-serif;
    }

    #letterH.show {
      opacity: 1;
      transform: scale(1);
    }

    /* ===== ЛОГОТИП В УГЛУ (постоянно виден) ===== */
    #logoHint {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 1001;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #logoHint.show {
      opacity: 1;
    }

    #logoHint span:first-child {
      color: #FFFFFF;
    }
    #logoHint span:last-child {
      color: #00F0FF;
    }

    /* ===== ЗАГРУЗКА (скрыта сразу) ===== */
    #loading {
      display: none;
    }

    @media (max-width: 600px) {
      #letterH {
        font-size: 120px;
      }
      .sparkle {
        width: 3px;
        height: 3px;
      }
    }
  </style>
</head>
<body>

  <!-- ЗАГРУЗКА (скрыта) -->
  <div id="loading"></div>

  <!-- ИНТРО -->
  <div id="intro">
    <div id="explosion"></div>
    <div id="sparklesContainer"></div>
    <div id="letterH">H</div>
  </div>

  <!-- ЛОГОТИП В УГЛУ -->
  <div id="logoHint">
    <span>Metric</span><span>Hit</span>
  </div>

  <script>
    // ================================================================
    //  ЗАПУСКАЕМ СРАЗУ, БЕЗ ОЖИДАНИЙ
    // ================================================================

    const CONFIG = {
      sparkleCount: 200,
      explosionDuration: 1800,
      collectDelay: 400,
    };

    // ---- СОЗДАНИЕ ПЫЛИНОК ----
    function createSparkles() {
      const container = document.getElementById('sparklesContainer');
      const count = CONFIG.sparkleCount;
      const w = window.innerWidth;
      const h = window.innerHeight;

      for (let i = 0; i < count; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';

        const angle = Math.random() * Math.PI * 2;
        const distance = 80 + Math.random() * Math.min(w, h) * 0.45;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;

        sparkle.style.setProperty('--tx', tx + 'px');
        sparkle.style.setProperty('--ty', ty + 'px');

        const size = 2 + Math.random() * 4;
        sparkle.style.width = size + 'px';
        sparkle.style.height = size + 'px';

        sparkle.style.background = Math.random() > 0.3 ? '#00F0FF' : '#FFFFFF';

        // Задержка для волны
        sparkle.style.animationDelay = (Math.random() * 0.4) + 's';

        container.appendChild(sparkle);
      }
    }

    // ---- ЗАПУСК ----
    function start() {
      const explosion = document.getElementById('explosion');
      const sparkles = document.querySelectorAll('.sparkle');
      const letterH = document.getElementById('letterH');
      const intro = document.getElementById('intro');
      const logoHint = document.getElementById('logoHint');

      // 1. Взрыв
      explosion.classList.add('active');

      // 2. Пылинки (через 200ms)
      setTimeout(() => {
        sparkles.forEach((el) => {
          el.classList.add('fly');
        });
      }, 200);

      // 3. Буква H (после взрыва)
      const totalDelay = CONFIG.explosionDuration + CONFIG.collectDelay;
      setTimeout(() => {
        letterH.classList.add('show');
      }, totalDelay);

      // 4. Показываем логотип в углу
      setTimeout(() => {
        logoHint.classList.add('show');
      }, totalDelay + 300);

      // 5. Скрываем интро (через 4 секунды после появления H)
      setTimeout(() => {
        intro.classList.add('hidden');
        setTimeout(() => {
          intro.style.display = 'none';
        }, 1000);
      }, totalDelay + 2500);

      console.log('🚀 MetricHit запущен!');
      console.log(`✨ Пылинок: ${CONFIG.sparkleCount}`);
    }

    // ---- ИНИЦИАЛИЗАЦИЯ (мгновенно) ----
    createSparkles();
    start();

    // Фолбэк: если что-то пошло не так
    setTimeout(() => {
      const intro = document.getElementById('intro');
      if (!intro.classList.contains('hidden')) {
        intro.classList.add('hidden');
        document.getElementById('logoHint').classList.add('show');
        setTimeout(() => { intro.style.display = 'none'; }, 500);
      }
    }, 6000);
  </script>
</body>
</html>
