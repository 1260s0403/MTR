<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro — Welcome</title>
    <style>
        /* Базовые сбросы и глубокий темный фон */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050508;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* Для 3D эффекта при растворении */
        }

        /* Главный экран интро */
        .intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0c0f1d 0%, #030305 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transform-style: preserve-3d;
            transition: opacity 0.9s cubic-bezier(0.77, 0, 0.175, 1), 
                        transform 0.9s cubic-bezier(0.77, 0, 0.175, 1),
                        visibility 0.9s;
        }

        /* Контейнер логотипа с адаптивным размером */
        .logo-wrapper {
            width: 85vw;
            max-width: 750px; /* Ограничение, чтобы текст не был гигантским на мониторах */
            height: auto;
            opacity: 0;
            transform: translateY(-10px) scale(0.98);
            animation: introAppear 1.8s cubic-bezier(0.215, 0.610, 0.355, 1) forwards 0.3s;
        }

        .logo-wrapper svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Эффект неонового свечения для циановых элементов */
        .neon-glow {
            filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.7)) 
                    drop-shadow(0 0 30px rgba(0, 240, 255, 0.3));
            animation: neonFlicker 3s infinite alternate 2s;
        }

        /* Интерактивная кнопка */
        .enter-btn {
            margin-top: 60px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
            padding: 14px 40px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 5px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 3px;
            opacity: 0;
            transform: translateY(15px);
            animation: btnAppear 1.2s cubic-bezier(0.215, 0.610, 0.355, 1) forwards 1.6s;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .enter-btn:hover {
            border-color: #00F0FF;
            color: #00F0FF;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);
            text-shadow: 0 0 6px rgba(0, 240, 255, 0.8);
            letter-spacing: 7px; /* Эффект раздвижения букв при наведении */
            padding-left: 42px; /* Компенсация для центрирования из-за letter-spacing */
        }

        /* Анимация растворения интро (взрывной уход вглубь) */
        .intro-container.fade-out {
            opacity: 0;
            transform: scale(1.15) translateZ(50px);
            visibility: hidden;
        }

        /* Заглушка под будущий контент сайта */
        .main-content {
            color: #ffffff;
            text-align: center;
            opacity: 0;
            transform: scale(0.95);
            transition: all 1.2s cubic-bezier(0.075, 0.82, 0.165, 1) 0.3s;
        }
        body.content-active .main-content {
            opacity: 1;
            transform: scale(1);
        }

        /* Ключевые кадры */
        @keyframes introAppear {
            0% {
                opacity: 0;
                transform: translateY(15px) scale(0.95);
                filter: blur(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes btnAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Эффект легкого «дыхания»/мерцания кибер-неона */
        @keyframes neonFlicker {
            0%, 100% { filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.75)) drop-shadow(0 0 25px rgba(0, 240, 255, 0.3)); }
            50% { filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.9)) drop-shadow(0 0 35px rgba(0, 240, 255, 0.45)); }
            92% { opacity: 1; }
            93% { opacity: 0.95; }
            94% { opacity: 1; }
        }
    </style>
</head>
