<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro</title>
    <style>
        /* Обнуление стилей и темный футуристичный фон */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0a0a0c;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Главный контейнер интро */
        .intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #141722 0%, #050508 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.77, 0, 0.175, 1), visibility 0.8s;
        }

        /* Обертка для логотипа с анимацией появления */
        .logo-wrapper {
            width: 80vw;
            max-width: 400px;
            height: auto;
            opacity: 0;
            transform: scale(0.95);
            animation: fadeInLogo 1.5s cubic-bezier(0.215, 0.610, 0.355, 1) forwards 0.5s;
        }

        .logo-wrapper svg {
            width: 100%;
            height: auto;
            /* Неоновое свечение для цианового элемента внутри SVG */
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.6));
        }

        /* Интерактивная кнопка входа */
        .enter-btn {
            margin-top: 50px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 12px 35px;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInBtn 1s ease forwards 1.8s;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .enter-btn:hover {
            border-color: #00F0FF;
            color: #00F0FF;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }

        /* Класс для анимации выхода (скрытия интро) */
        .intro-container.fade-out {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.1);
        }

        /* Эффектный фоновый текст или заглушка для основного сайта (появится после интро) */
        .main-content {
            color: #ffffff;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 0.5s;
        }
        body.content-active .main-content {
            opacity: 1;
            transform: translateY(0);
        }

        /* Ключевые кадры анимаций */
        @keyframes fadeInLogo {
            0% {
                opacity: 0;
                transform: scale(0.90);
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes fadeInBtn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- ИНТРО ЭКРАН -->
    <div class="intro-container" id="introScreen">
        <div class="logo-wrapper">
            <!-- Исправленный и центрированный SVG из вашего ТЗ -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="50 450 400 120" width="100%" height="100%">
                <g id="Слой_x0020_1">
                    <polygon fill="white" points="137.796,455.339 138.005,498.347 115.673,537.074 98.529,537.074 74.84,497.75 75.268,554.929 51.295,554.929 51.295,455.339 76.477,455.339 108.053,508.087 "/>
                    <polygon fill="#00F0FF" fill-rule="nonzero" points="143.942,554.93 143.942,455.339 170.12,455.339 170.12,491.334 206.399,491.334 206.399,455.339 232.578,455.339 232.578,554.93 206.399,554.93 206.399,515.236 170.12,515.236 170.12,554.93 "/>
                    <polygon fill="white" fill-rule="nonzero" points="266.869,554.48 266.869,455.232 291.964,455.232 328.757,516.695 318.336,516.837 353.073,455.232 378.098,455.232 378.098,554.48 352.931,554.48 353.428,488.268 357.965,489.969 331.026,536.687 313.941,536.687 285.797,489.969 290.263,488.268 290.759,554.48 "/>
                    <path fill="white" fill-rule="nonzero" d="M433.606,556.607 c-8.129,0 -15.242,-1.631 -21.339,-4.868 c-6.096,-3.237 -10.823,-7.751 -14.202,-13.54 c-3.379,-5.79 -5.08,-12.548 -5.08,-20.299 c0,-5.671 0.992,-10.87 2.977,-15.572 c1.985,-4.703 4.774,-8.767 8.365,-12.193 c3.592,-3.427 7.846,-6.074 12.737,-7.964 c4.892,-1.89 10.256,-2.836 16.116,-2.836 c6.569,0 12.406,1.135 17.487,3.427 c5.08,2.292 9.263,5.506 12.571,9.641 c3.308,4.135 5.601,8.98 6.853,14.509 c1.253,5.529 1.229,11.556 -0.047,18.077 l-53.736,0 c0.142,2.411 0.992,4.514 2.528,6.31 c1.536,1.796 3.616,3.19 6.263,4.206 c2.646,1.016 5.695,1.536 9.145,1.536 c4.395,0 8,0" />
                </g>
            </svg>
        </div>
        <button class="enter-btn" id="enterBtn">Войти</button>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ САЙТА (будет виден после клика) -->
    <div class="main-content">
        <h1 style="font-size: 2.5rem; font-weight: 300; letter-spacing: 2px;">Добро пожаловать</h1>
        <p style="color: #8a8a93; margin-top: 15px;">Основной контент вашего сайта будет загружаться здесь.</p>
    </div>

    <!-- ЛОГИКА ИНТРА -->
    <script>
        document.getElementById('enterBtn').addEventListener('click', () => {
            const intro = document.getElementById('introScreen');
            
            // Запускаем анимацию исчезновения интро (масштабирование и fade-out)
            intro.classList.add('fade-out');
            
            // Активируем появление основного контента сайта
            document.body.classList.add('content-active');
            
            // Полностью удаляем интро из DOM через 800ms, чтобы не нагружать систему
            setTimeout(() => {
                intro.remove();
            }, 800);
        });
    </script>
</body>
</html>
